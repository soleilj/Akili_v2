name: akili_tv
description: "Akili TV: watch Kenya's family channel live on Android phones, tablets and Android TV."
publish_to: "none"

# version: <user-facing version>+<build number>
# The build pipeline overrides the build number automatically, so Google Play
# always receives an increasing number. Bump the first part for each release.
version: 1.1.0+3

environment:
  sdk: ^3.11.4

dependencies:
  flutter:
    sdk: flutter
  video_player: ^2.8.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  flutter_launcher_icons: ^0.14.4

flutter_launcher_icons:
  android: true
  ios: true
  image_path: "assets/images/AkiliTV_Favicon.png"

flutter:
  uses-material-design: true

  assets:
    - assets/images/logo.png
    - assets/images/hero.png
    - assets/images/icon_mark.png

  # Each font is one "variable" file that contains every weight.
  fonts:
    - family: Inter
      fonts:
        - asset: assets/fonts/Inter-VariableFont_opsz,wght.ttf
    - family: PublicSans
      fonts:
        - asset: assets/fonts/PublicSans-VariableFont_wght.ttf
