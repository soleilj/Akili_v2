# Builds the Akili TV Android app on GitHub's servers. Nobody needs Flutter
# installed locally.
#
# Every push / pull request:  checks the code, runs tests, builds an APK you
#                             can install on a phone or Android TV to test.
# With signing secrets set:   also builds the .aab bundle for Google Play.
#
# Download results: GitHub -> Actions tab -> pick a run -> "Artifacts".

name: Build Android app

on:
  push:
    branches: [main, akili-v2]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    env:
      KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      # Google Play needs a higher number on every upload.
      BUILD_NUMBER: ${{ github.run_number }}

    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Get packages
        run: flutter pub get

      - name: Check code
        run: flutter analyze --no-fatal-infos

      - name: Run tests
        run: flutter test

      - name: Set up release signing
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 --decode > android/app/upload-keystore.jks
          cat > android/key.properties <<EOF
          storeFile=upload-keystore.jks
          storePassword=$KEYSTORE_PASSWORD
          keyAlias=$KEY_ALIAS
          keyPassword=$KEY_PASSWORD
          EOF

      - name: Build installable APK
        run: flutter build apk --release --build-number=$((BUILD_NUMBER + 100))

      - name: Build Google Play bundle
        if: env.KEYSTORE_BASE64 != ''
        run: flutter build appbundle --release --build-number=$((BUILD_NUMBER + 100))

      - name: Upload APK
        uses: actions/upload-artifact@v6
        with:
          name: akili-tv-apk-${{ github.run_number }}
          path: build/app/outputs/flutter-apk/app-release.apk

      - name: Upload Play bundle
        if: env.KEYSTORE_BASE64 != ''
        uses: actions/upload-artifact@v6
        with:
          name: akili-tv-play-bundle-${{ github.run_number }}
          path: build/app/outputs/bundle/release/app-release.aab

      - name: Clean up signing files
        if: always()
        run: rm -f android/app/upload-keystore.jks android/key.properties
